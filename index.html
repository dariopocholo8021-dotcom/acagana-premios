<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171717">
  <meta name="description" content="Encuentra las redes sociales oficiales de Acagana Premios. Síguenos en Instagram, Facebook y TikTok.">
  <title>Acagana Premios | Nuestras redes</title>
  <style>
    :root { color-scheme: light; --ink:#171717; --red:#f43f5e; --gold:#ffd166; --paper:#fffaf0; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#fff; background:radial-gradient(circle at 10% 10%,#64204c 0,transparent 32%),radial-gradient(circle at 90% 85%,#174a73 0,transparent 35%),#171717; display:flex; align-items:center; justify-content:center; padding:24px; }
    .wrap { width:min(100%,460px); text-align:center; }
    .spark { color:var(--gold); font-size:25px; letter-spacing:12px; margin-bottom:10px; }
    .logo { width:104px; height:104px; border-radius:28px; display:grid; place-items:center; margin:0 auto 18px; background:linear-gradient(135deg,#ff4d6d,#f59e0b); box-shadow:0 12px 40px #0006; border:3px solid #ffffffbb; }
    .logo svg { width:61px; height:61px; }
    h1 { margin:0; font-size:clamp(2rem,8vw,2.8rem); line-height:1; font-weight:900; letter-spacing:-1.5px; }
    .sub { color:var(--gold); font-weight:750; margin:14px 0 9px; font-size:1.08rem; }
    .desc { color:#e7e7e7; line-height:1.55; margin:0 auto 26px; max-width:340px; }
    .links { display:grid; gap:13px; }
    .link { min-height:62px; border-radius:17px; padding:15px 19px; color:#fff; text-decoration:none; display:flex; align-items:center; gap:14px; font-size:1.04rem; font-weight:800; box-shadow:0 8px 20px #0003; transition:transform .15s ease,filter .15s ease; }
    .link:hover,.link:focus-visible { transform:translateY(-2px); filter:brightness(1.08); outline:3px solid #fff9; outline-offset:3px; }
    .link svg { width:29px; height:29px; flex:none; }
    .link span { flex:1; text-align:left; }
    .link .arrow { width:19px; height:19px; opacity:.85; }
    .instagram { background:linear-gradient(115deg,#833ab4,#e1306c,#f77737); }
    .facebook { background:#1877f2; }
    .tiktok { background:#080808; border:1px solid #555; }
    .note { color:#c9c9c9; font-size:.82rem; margin-top:24px; }
    .note strong { color:#fff; }
    @media print { body { background:#fff; color:#171717; } }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="spark" aria-hidden="true">✦ ✧ ✦</div>
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none"><path d="M32 5 38 22 56 15 47 32 60 43 41 44 32 61 24 44 5 43 18 32 9 15 26 22Z" fill="#fff"/><circle cx="32" cy="32" r="8" fill="#f43f5e"/></svg></div>
    <h1>ACAGANA<br>PREMIOS</h1>
    <p class="sub">¡Síguenos en nuestras redes!</p>
    <p class="desc">Entérate de novedades, publicaciones y mucho más. Encuéntranos aquí:</p>
    <nav class="links" aria-label="Redes sociales">
      <a class="link instagram" href="https://www.instagram.com/acaganapremios?obrf=NzNrMjFmNnNmN3Zh" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg><span>Instagram</span><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M7 7h10v10"/></svg>
      </a>
      <a class="link facebook" href="https://www.facebook.com/share/1FXmnCZbU7/" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.4 21v-8h2.7l.4-3.1h-3.1v-2c0-.9.3-1.5 1.6-1.5h1.7V3.6c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.1H7.2V13H10v8h3.4Z"/></svg><span>Facebook</span><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M7 7h10v10"/></svg>
      </a>
      <a class="link tiktok" href="https://www.tiktok.com/@acaganas8?_r=1&_t=ZS-9AQdZUKuch5" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.6 7.1a6.7 6.7 0 0 1-4.1-1.4v8.1a6 6 0 1 1-5.2-5.9v3.3a2.8 2.8 0 1 0 2 2.7V2.5h3.2c.2 2.1 1.6 3.8 4.1 4.1v.5Z"/></svg><span>TikTok</span><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M7 7h10v10"/></svg>
      </a>
    </nav>
    <p class="note">Gracias por seguir a <strong>Acagana Premios</strong> ✨</p>
  </main>
</body>
</html>
